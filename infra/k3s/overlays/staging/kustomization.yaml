apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: naicha-staging
resources:
  - ../../base
commonLabels:
  app.kubernetes.io/environment: staging
images:
  - name: ghcr.io/your-org/naicha-backend
    newTag: staging
replicas:
  - name: naicha-api
    count: 2
  - name: naicha-worker
    count: 1
patchesStrategicMerge:
  - ingress-patch.yaml
