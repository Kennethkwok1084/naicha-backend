[project]
name = "naicha-backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Milk Tea storefront."
authors = [{ name = "Naicha Team" }]
readme = "readme.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.1.12",
  "alembic>=1.13.0",
  "slowapi>=0.1.9",
  "orjson>=3.10.7",
  "httpx>=0.27.0",
  "structlog>=24.2.0",
  "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.4.0",
  "isort>=5.13.2",
  "ruff>=0.5.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "coverage>=7.4.4",
  "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]
src = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
