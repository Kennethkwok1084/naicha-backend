apiVersion: apps/v1
kind: Deployment
metadata:
  name: naicha-api
  labels:
    app: naicha-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: naicha-api
  template:
    metadata:
      labels:
        app: naicha-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/naicha-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: prod
            - name: PROMETHEUS_ENABLED
              value: "true"
            - name: WAF_TRUST_PROXY
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: naicha-api-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: naicha-api-secrets
                  key: SECRET_KEY
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-pull-token
