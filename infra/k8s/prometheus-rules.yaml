apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: naicha-m4-alerts
  labels:
    prometheus: naicha
    role: alert-rules
spec:
  groups:
    - name: m4-business-alerts
      rules:
        - alert: NaichaPOSSuccessRateLow
          expr: sum(rate(admin_order_created_total{result="success"}[5m])) / clamp_min(sum(rate(admin_order_created_total[5m])), 1) < 0.95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "POS 成功率低于 95%"
            description: "过去 10 分钟内 POS 建单成功率低于 95%，请检查打印队列或库存状态。"
        - alert: NaichaPOSLatencyHigh
          expr: histogram_quantile(0.95, sum(rate(admin_order_create_latency_ms_bucket[5m])) by (le)) > 0.2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "POS 建单 P95 时延超过 200ms"
            description: "建单耗时异常，请排查数据库连接池、库存锁或外部依赖。"
        - alert: NaichaPaymentMatchConflictSpike
          expr: sum(rate(payment_match_attempt_total{result="conflict"}[5m])) / clamp_min(sum(rate(payment_match_attempt_total[5m])), 1) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "静态码匹配冲突率超过 10%"
            description: "请确认店员是否误输入金额或订单已支付被重复匹配。"
        - alert: NaichaDashboardLatencyHigh
          expr: histogram_quantile(0.95, sum(rate(admin_dashboard_query_latency_ms_bucket[5m])) by (le)) > 0.12
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "看板查询 P95 超过 120ms"
            description: "请检查数据库负载或缓存是否失效，必要时刷新物化视图。"
    - name: m4-infra-alerts
      rules:
        - alert: NaichaPrintJobEnqueueFailures
          expr: increase(print_job_enqueue_failed_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "打印任务入队失败"
            description: "连续 5 分钟检测到打印任务入队失败，请检查 Celery Broker 或打印服务。"
        - alert: NaichaHomeCloudLatencyHigh
          expr: avg_over_time(home_cloud_ping_rtt_seconds[5m]) > 0.2
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "家→云网络 RTT 超过 200ms"
            description: "请确认家庭店铺网络状况或运营商线路波动。"
        - alert: NaichaHomeCloudPacketLoss
          expr: avg_over_time(home_cloud_ping_packet_loss_ratio[5m]) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "家→云网络丢包率超过 5%"
            description: "请检查家庭路由、ISP 或云侧防火墙策略是否异常。"
    - name: m5-business-alerts
      rules:
        - alert: NaichaReservationReminderSilent
          expr: increase(reservation_reminder_total[15m]) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "预约提醒 15 分钟内未触发"
            description: "可能存在 Celery 任务阻塞或预约订单状态异常，请检查任务日志。"
        - alert: NaichaReservationActivationDelay
          expr: increase(reservation_activated_total[15m]) == 0 and sum(increase(reservation_reminder_total[15m])) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "已提醒的预约订单未按时入列"
            description: "检查订单状态与 Celery Worker，确认是否存在支付状态或锁阻塞。"
        - alert: NaichaReconciliationDiscrepancyPersist
          expr: max_over_time(reconciliation_diff_count{type="unmatched_payments"}[24h]) > 0
          for: 1d
          labels:
            severity: warning
          annotations:
            summary: "对账存在未匹配支付"
            description: "连续 24 小时检测到未匹配支付，请查看 CSV 报表或日志进行人工对账。"
        - alert: NaichaReconciliationRuntimeHigh
          expr: histogram_quantile(0.95, sum(rate(celery_task_runtime_seconds_bucket{task=\"run_daily_reconciliation\"}[1h])) by (le)) > 60
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "每日对账任务执行时间超过 60 秒"
            description: "请检查数据库性能或是否存在锁等待，必要时拆分对账窗口。"
